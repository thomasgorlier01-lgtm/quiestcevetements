['Léa','Elle','un chapeau violet, un tee-shirt violet, un short jaune et des bottes rouges'],
['Eva','Elle','un tee-shirt blanc, un short noir et des baskets roses']
].map(([name,pronoun,clothes],id)=>({id,name,description:`${pronoun} porte ${clothes}.`}));
const $=id=>document.getElementById(id),cards=[];
let mode='home',state=null,eliminated=new Set(),audioGeneration=0;
function shuffle(input){const a=[...input];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopAudio(){audioGeneration++;if('speechSynthesis'in window)window.speechSynthesis.cancel();$('description').classList.remove('playing')}
function speak(){stopAudio();$('audioStatus').textContent='';if(!state||state.phase==='finished'||state.phase==='lost')return;if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('audioStatus').textContent='La lecture audio n’est pas disponible dans ce navigateur.';return}const token=audioGeneration,utterance=new SpeechSynthesisUtterance(CHARACTERS[state.rounds[state.round]].description);utterance.lang='fr-FR';utterance.rate=.85;const voices=speechSynthesis.getVoices(),french=voices.find(v=>/^fr[-_]FR$/i.test(v.lang))||voices.find(v=>/^fr/i.test(v.lang));if(french)utterance.voice=french;utterance.onstart=()=>{if(token===audioGeneration)$('description').classList.add('playing')};utterance.onend=()=>{if(token===audioGeneration)$('description').classList.remove('playing')};utterance.onerror=e=>{if(token!==audioGeneration)return;$('description').classList.remove('playing');if(e.error!=='interrupted'&&e.error!=='canceled')$('audioStatus').textContent='La lecture audio est indisponible. Réessaie ou vérifie la voix française de ton appareil.'};speechSynthesis.speak(utterance)}
function renderClass(){$('remaining').textContent=`${24-eliminated.size} personnage${24-eliminated.size===1?'':'s'} visible${24-eliminated.size===1?'':'s'} sur 24`;cards.forEach((b,i)=>{const hidden=eliminated.has(i);b.disabled=false;b.className='card'+(hidden?' eliminated':'');b.setAttribute('aria-pressed',String(hidden));b.setAttribute('aria-label',`${CHARACTERS[i].name} : ${hidden?'carte retournée, rétablir':'éliminer'}`)})}
function renderSolo(){const end=['finished','lost'].includes(state.phase);$('stats').hidden=false;$('score').textContent=`★ ${state.score} / 10`;$('hearts').textContent='♥'.repeat(state.lives)+'♡'.repeat(3-state.lives);$('hearts').setAttribute('aria-label',`${state.lives} cœurs restants sur 3`);$('progress').textContent=end?'Partie terminée':`Description ${state.round+1} sur 10`;$('description').hidden=end;$('descriptionText').textContent=CHARACTERS[state.rounds[state.round]].description;$('next').hidden=state.phase!=='correct';$('restart').hidden=end;$('result').hidden=!end;$('resultText').textContent=state.phase==='finished'?`Bravo ! Tu as trouvé les 10 personnages !`:`Tu as trouvé ${state.score} personnage${state.score>1?'s':''} sur 10.`;cards.forEach((b,i)=>{b.className='card'+(state.wrongIds.includes(i)?' wrong':'')+(state.phase==='correct'&&i===state.rounds[state.round]?' correct':'');b.disabled=state.phase!=='playing'||state.wrongIds.includes(i);b.removeAttribute('aria-pressed');b.setAttribute('aria-label',CHARACTERS[i].name)});if(end)stopAudio()}
function choose(id){if(mode==='class'){eliminated.has(id)?eliminated.delete(id):eliminated.add(id);renderClass();return}if(mode!=='solo'||state.phase!=='playing'||state.wrongIds.includes(id))return;if(id===state.rounds[state.round]){state.score++;state.phase='correct';$('feedback').textContent='Bravo, tu as trouvé !';$('feedback').className='success';stopAudio()}else{state.lives--;state.wrongIds.push(id);$('feedback').textContent=state.lives?'Essaie encore. Écoute ou relis les vêtements.':'Tu n’as plus de cœur. Tu peux recommencer !';$('feedback').className='error';if(!state.lives)state.phase='lost'}renderSolo();if(state.phase==='correct')$('next').focus();if(state.phase==='lost')$('playAgain').focus()}
function startSolo(){stopAudio();state={rounds:shuffle(CHARACTERS.map(c=>c.id)).slice(0,10),round:0,score:0,lives:3,phase:'playing',wrongIds:[]};$('audioStatus').textContent='';$('feedback').textContent='Clique sur le personnage décrit.';$('feedback').className='';renderSolo()}
function selectMode(nextMode){stopAudio();mode=nextMode;document.body.dataset.mode=mode;$('home').hidden=mode!=='home';$('play').hidden=mode==='home';$('homeButton').hidden=mode==='home';$('classTools').hidden=mode!=='class';$('prompt').hidden=mode!=='solo';$('stats').hidden=mode!=='solo';if(mode==='home')return;$('modeTitle').textContent=mode==='class'?'· En classe':'· Je joue seul';$('instruction').textContent=mode==='class'?'Un clic retourne une carte. Un autre clic la rétablit.':'Lis ou écoute la description, puis choisis le bon enfant.';if(mode==='class'){eliminated.clear();renderClass()}else startSolo();window.scrollTo(0,0)}
CHARACTERS.forEach((c,i)=>{const button=document.createElement('button');button.type='button';button.className='card';button.dataset.id=i;button.style.setProperty('--col',i%8);button.style.setProperty('--row',Math.floor(i/8));const portrait=document.createElement('span');portrait.className='portrait';const img=document.createElement('img');img.src=SPRITE;img.alt='';img.draggable=false;portrait.append(img);const back=document.createElement('span');back.className='backface';back.textContent='?';back.setAttribute('aria-hidden','true');button.append(portrait,back);button.onclick=()=>choose(i);cards.push(button);$('board').append(button)});
$('preview').src=SPRITE;$('classMode').onclick=()=>selectMode('class');$('soloMode').onclick=()=>selectMode('solo');$('homeButton').onclick=()=>{selectMode('home');$('classMode').focus()};$('restore').onclick=()=>{eliminated.clear();renderClass()};$('description').onclick=speak;$('restart').onclick=startSolo;$('playAgain').onclick=()=>{startSolo();$('description').focus()};$('next').onclick=()=>{if(state.phase!=='correct')return;stopAudio();if(state.round===9)state.phase='finished';else{state.round++;state.phase='playing';state.wrongIds=[];$('feedback').textContent='Clique sur le personnage décrit.';$('feedback').className='';$('audioStatus').textContent=''}renderSolo();if(state.phase==='finished')$('playAgain').focus();else $('description').focus()};window.addEventListener('pagehide',stopAudio);
window.FLEGame={get mode(){return mode},get state(){return state?JSON.parse(JSON.stringify(state)):null},characters:CHARACTERS};
</script><script src="./fullscreen.js?v=1" defer></script></body></html>
